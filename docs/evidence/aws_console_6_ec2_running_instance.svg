    <text x="24" y="468" fill="#059669" class="txt" font-size="12" font-weight="600">✓ Security Task 3 &amp; 4 Fulfilled: EC2 instance running with attached EC2-S3-ImageGallery-Role (STS temporary tokens).</text>
