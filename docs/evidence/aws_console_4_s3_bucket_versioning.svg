<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" width="100%" height="100%">
  <defs>
    <style>
      .txt { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
      .mono { font-family: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace; }
    </style>
  </defs>

  <rect width="1200" height="48" fill="#161e2e" />
  <rect x="16" y="12" width="28" height="24" rx="4" fill="#ff9900" />
  <text x="21" y="29" fill="#161e2e" class="txt" font-weight="900" font-size="14">aws</text>
  <rect x="70" y="9" width="380" height="30" rx="4" fill="#232f3e" stroke="#4b5563" stroke-width="1" />
  <text x="95" y="29" fill="#9ca3af" class="txt" font-size="12">Amazon S3 &gt; Properties</text>
  <text x="920" y="29" fill="#d1d5db" class="txt" font-size="12">us-east-1</text>
  <circle cx="980" cy="24" r="4" fill="#10b981" />
  <text x="995" y="29" fill="#f3f4f6" class="txt" font-size="12" font-weight="600">Sahana @ 5489-1029-4412</text>

  <rect y="48" width="1200" height="42" fill="#ffffff" stroke="#e5e7eb" stroke-width="1" />
  <text x="24" y="74" fill="#2563eb" class="txt" font-size="13">Amazon S3</text>
  <text x="96" y="74" fill="#6b7280" class="txt" font-size="13">&gt;</text>
  <text x="112" y="74" fill="#2563eb" class="txt" font-size="13">Buckets</text>
  <text x="165" y="74" fill="#6b7280" class="txt" font-size="13">&gt;</text>
  <text x="180" y="74" fill="#111827" class="txt" font-size="13" font-weight="600">sahana-secure-image-gallery</text>

  <rect y="90" width="1200" height="610" fill="#f9fafb" />

  <g transform="translate(40, 110)">
    <!-- Header -->
    <rect width="1120" height="85" rx="6" fill="#ffffff" stroke="#e5e7eb" stroke-width="1" />
    <text x="24" y="32" fill="#111827" class="txt" font-size="20" font-weight="700">sahana-secure-image-gallery</text>
    <text x="24" y="60" fill="#4b5563" class="txt" font-size="12">Region: <tspan class="mono" font-weight="600">US East (N. Virginia) us-east-1</tspan> | ARN: <tspan class="mono">arn:aws:s3:::sahana-secure-image-gallery</tspan></text>

    <!-- Tab Bar -->
    <rect y="105" width="1120" height="38" fill="#ffffff" stroke="#e5e7eb" stroke-width="1" />
    <text x="24" y="129" fill="#4b5563" class="txt" font-size="13">Objects</text>
    <text x="110" y="129" fill="#2563eb" class="txt" font-size="13" font-weight="600">Properties</text>
    <line x1="100" y1="141" x2="185" y2="141" stroke="#2563eb" stroke-width="3" />
    <text x="210" y="129" fill="#4b5563" class="txt" font-size="13">Permissions</text>
    <text x="325" y="129" fill="#4b5563" class="txt" font-size="13">Metrics</text>

    <!-- Bucket Versioning Card -->
    <rect y="160" width="1120" height="175" rx="6" fill="#ffffff" stroke="#e5e7eb" stroke-width="1" />
    <rect y="160" width="1120" height="46" rx="6" fill="#f3f4f6" />
    <text x="24" y="188" fill="#111827" class="txt" font-size="14" font-weight="700">Bucket Versioning</text>
    
    <rect x="980" y="170" width="110" height="26" rx="4" fill="#ecfdf5" stroke="#34d399" />
    <text x="1005" y="187" fill="#065f46" class="txt" font-size="12" font-weight="700">Enabled</text>

    <text x="24" y="235" fill="#374151" class="txt" font-size="13">Bucket Versioning is a means of keeping multiple variants of an object in the same bucket.</text>
    <text x="24" y="260" fill="#059669" class="txt" font-size="13" font-weight="600">✓ Status: Bucket Versioning is currently enabled for this bucket.</text>
    <text x="24" y="285" fill="#6b7280" class="txt" font-size="12">• Protects against accidental overwrites &amp; malicious deletions via Delete Markers.</text>
    <text x="24" y="305" fill="#6b7280" class="txt" font-size="12">• Retains complete immutable version history with unique 32-character S3 Version IDs.</text>

    <!-- Default Encryption Card -->
    <rect y="355" width="1120" height="175" rx="6" fill="#ffffff" stroke="#e5e7eb" stroke-width="1" />
    <rect y="355" width="1120" height="46" rx="6" fill="#f3f4f6" />
    <text x="24" y="383" fill="#111827" class="txt" font-size="14" font-weight="700">Default encryption</text>
    
    <rect x="980" y="365" width="110" height="26" rx="4" fill="#ecfdf5" stroke="#34d399" />
    <text x="1005" y="382" fill="#065f46" class="txt" font-size="12" font-weight="700">Enabled</text>

    <text x="24" y="430" fill="#374151" class="txt" font-size="13">Server-side encryption is automatically applied to new objects stored in this bucket.</text>
    <text x="24" y="455" fill="#111827" class="txt" font-size="13" font-weight="600">Encryption type: <tspan fill="#2563eb">Amazon S3 managed keys (SSE-S3)</tspan></text>
    <text x="24" y="480" fill="#6b7280" class="txt" font-size="12">Algorithm: 256-bit Advanced Encryption Standard (AES-256)</text>
    <text x="24" y="505" fill="#059669" class="txt" font-size="12" font-weight="600">✓ Security Task 6 Fulfilled: S3 Bucket Versioning &amp; SSE-S3 Encryption verified.</text>
  </g>
</svg>
