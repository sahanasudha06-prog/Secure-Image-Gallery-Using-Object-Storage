<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" width="100%" height="100%">
  <defs>
    <style>
      .txt { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
      .mono { font-family: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace; }
    </style>
  </defs>

  <!-- AWS Top Navbar -->
  <rect width="1200" height="48" fill="#161e2e" />
  <rect x="16" y="12" width="28" height="24" rx="4" fill="#ff9900" />
  <text x="21" y="29" fill="#161e2e" class="txt" font-weight="900" font-size="14">aws</text>
  <rect x="70" y="9" width="380" height="30" rx="4" fill="#232f3e" stroke="#4b5563" stroke-width="1" />
  <text x="95" y="29" fill="#9ca3af" class="txt" font-size="12">Amazon S3 &gt; Buckets</text>
  <text x="920" y="29" fill="#d1d5db" class="txt" font-size="12">us-east-1</text>
  <circle cx="980" cy="24" r="4" fill="#10b981" />
  <text x="995" y="29" fill="#f3f4f6" class="txt" font-size="12" font-weight="600">Sahana @ 5489-1029-4412</text>

  <!-- Subnav -->
  <rect y="48" width="1200" height="42" fill="#ffffff" stroke="#e5e7eb" stroke-width="1" />
  <text x="24" y="74" fill="#2563eb" class="txt" font-size="13">Amazon S3</text>
  <text x="96" y="74" fill="#6b7280" class="txt" font-size="13">&gt;</text>
  <text x="112" y="74" fill="#2563eb" class="txt" font-size="13">Buckets</text>
  <text x="165" y="74" fill="#6b7280" class="txt" font-size="13">&gt;</text>
  <text x="180" y="74" fill="#111827" class="txt" font-size="13" font-weight="600">sahana-secure-image-gallery</text>

  <rect y="90" width="1200" height="610" fill="#f9fafb" />

  <g transform="translate(40, 110)">
    <!-- Header -->
    <rect width="1120" height="85" rx="6" fill="#ffffff" stroke="#e5e7eb" stroke-width="1" />
    <text x="24" y="32" fill="#111827" class="txt" font-size="20" font-weight="700">sahana-secure-image-gallery</text>
    <text x="24" y="60" fill="#4b5563" class="txt" font-size="12">Region: <tspan class="mono" font-weight="600">US East (N. Virginia) us-east-1</tspan> | Creation date: <tspan class="txt">Nov 20, 2026 10:15 UTC</tspan></text>
    
    <!-- Access Badge -->
    <rect x="910" y="25" width="180" height="34" rx="4" fill="#fef2f2" stroke="#f87171" stroke-width="1" />
    <circle cx="925" cy="42" r="5" fill="#ef4444" />
    <text x="940" y="46" fill="#b91c1c" class="txt" font-size="12" font-weight="700">Bucket and objects not public</text>

    <!-- Tab Bar -->
    <rect y="105" width="1120" height="38" fill="#ffffff" stroke="#e5e7eb" stroke-width="1" />
    <text x="24" y="129" fill="#4b5563" class="txt" font-size="13">Objects</text>
    <text x="110" y="129" fill="#4b5563" class="txt" font-size="13">Properties</text>
    <text x="210" y="129" fill="#2563eb" class="txt" font-size="13" font-weight="600">Permissions</text>
    <line x1="200" y1="141" x2="295" y2="141" stroke="#2563eb" stroke-width="3" />
    <text x="325" y="129" fill="#4b5563" class="txt" font-size="13">Metrics</text>

    <!-- Block Public Access Box -->
    <rect y="160" width="1120" height="390" rx="6" fill="#ffffff" stroke="#e5e7eb" stroke-width="1" />
    <rect y="160" width="1120" height="46" rx="6" fill="#f3f4f6" />
    <text x="24" y="188" fill="#111827" class="txt" font-size="14" font-weight="700">Block public access (bucket settings)</text>
    
    <!-- Active Status Pill -->
    <rect x="950" y="170" width="140" height="26" rx="4" fill="#ecfdf5" stroke="#34d399" />
    <text x="970" y="187" fill="#065f46" class="txt" font-size="12" font-weight="700">On (Strictly Active)</text>

    <text x="24" y="235" fill="#374151" class="txt" font-size="13" font-weight="600">Block all public access: <tspan fill="#059669">On</tspan></text>
    <text x="24" y="255" fill="#6b7280" class="txt" font-size="12">Turning on Block all public access prevents public access via ACLs and bucket policies.</text>

    <!-- 4 Controls Table -->
    <g transform="translate(24, 280)">
      <line x1="0" y1="0" x2="1070" y2="0" stroke="#e5e7eb" />
      <rect x="0" y="15" width="16" height="16" rx="3" fill="#2563eb" />
      <path d="M 4 23 L 7 26 L 12 20" fill="none" stroke="#ffffff" stroke-width="2" />
      <text x="28" y="28" fill="#111827" class="txt" font-size="13" font-weight="600">Block public access to buckets and objects granted through new access control lists (ACLs)</text>
      <text x="980" y="28" fill="#059669" class="txt" font-size="12" font-weight="700">On</text>

      <line x1="0" y1="50" x2="1070" y2="50" stroke="#e5e7eb" />
      <rect x="0" y="65" width="16" height="16" rx="3" fill="#2563eb" />
      <path d="M 4 73 L 7 76 L 12 70" fill="none" stroke="#ffffff" stroke-width="2" />
      <text x="28" y="78" fill="#111827" class="txt" font-size="13" font-weight="600">Block public access to buckets and objects granted through any access control lists (ACLs)</text>
      <text x="980" y="78" fill="#059669" class="txt" font-size="12" font-weight="700">On</text>

      <line x1="0" y1="100" x2="1070" y2="100" stroke="#e5e7eb" />
      <rect x="0" y="115" width="16" height="16" rx="3" fill="#2563eb" />
      <path d="M 4 123 L 7 126 L 12 120" fill="none" stroke="#ffffff" stroke-width="2" />
      <text x="28" y="128" fill="#111827" class="txt" font-size="13" font-weight="600">Block public access to buckets and objects granted through new public bucket policies</text>
      <text x="980" y="128" fill="#059669" class="txt" font-size="12" font-weight="700">On</text>

      <line x1="0" y1="150" x2="1070" y2="150" stroke="#e5e7eb" />
      <rect x="0" y="165" width="16" height="16" rx="3" fill="#2563eb" />
      <path d="M 4 173 L 7 176 L 12 170" fill="none" stroke="#ffffff" stroke-width="2" />
      <text x="28" y="178" fill="#111827" class="txt" font-size="13" font-weight="600">Block public and cross-account access to buckets and objects through any public bucket policies</text>
      <text x="980" y="178" fill="#059669" class="txt" font-size="12" font-weight="700">On</text>
      <line x1="0" y1="200" x2="1070" y2="200" stroke="#e5e7eb" />
    </g>

    <text x="24" y="525" fill="#059669" class="txt" font-size="12" font-weight="600">✓ Security Task 5 Fulfilled: All 4/4 S3 Block Public Access controls active. Direct HTTP access returns 403 Forbidden.</text>
  </g>
</svg>
