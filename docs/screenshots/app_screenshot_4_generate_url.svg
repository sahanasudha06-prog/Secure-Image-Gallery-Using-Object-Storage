<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 680" width="100%" height="100%">
  <rect width="1100" height="680" fill="#000000" opacity="0.75" />
  
  <g transform="translate(300, 160)">
    <rect width="500" height="360" rx="16" fill="#0f172a" stroke="#334155" stroke-width="1.5" />
    
    <text x="30" y="45" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="18" font-weight="700">Generate Image URL</text>
    <text x="30" y="68" fill="#64748b" font-family="system-ui, sans-serif" font-size="12">Time-bounded secure pre-signed link (Least Privilege)</text>

    <!-- Field 1 -->
    <text x="30" y="110" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12">Image Name</text>
    <rect x="30" y="120" width="440" height="36" rx="8" fill="#020617" stroke="#1e293b" />
    <text x="45" y="143" fill="#cbd5e1" font-family="monospace" font-size="12">hampi_stone_chariot.jpg</text>

    <!-- Field 2 -->
    <text x="30" y="180" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12">URL Expiration</text>
    <rect x="30" y="190" width="440" height="36" rx="8" fill="#020617" stroke="#1e293b" />
    <text x="45" y="213" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="12">1 Hour (Recommended)</text>

    <!-- Result URL box -->
    <rect x="30" y="250" width="440" height="42" rx="8" fill="#020617" stroke="#6366f1" />
    <text x="45" y="275" fill="#818cf8" font-family="monospace" font-size="11">https://sahana-s3.amazonaws.com/...token=9a8b7c6d</text>
    <rect x="385" y="256" width="75" height="30" rx="6" fill="#4f46e5" />
    <text x="405" y="275" fill="#ffffff" font-family="system-ui, sans-serif" font-size="11" font-weight="600">Copy</text>

    <text x="30" y="325" fill="#10b981" font-family="system-ui, sans-serif" font-size="12" font-weight="600">✓ Expires in 3600 seconds. Access automatically revoked thereafter.</text>
  </g>
</svg>
