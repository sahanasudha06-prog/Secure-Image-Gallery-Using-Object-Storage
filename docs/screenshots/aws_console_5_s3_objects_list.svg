<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" width="100%" height="100%">
  <defs>
    <style>
      .txt { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
      .mono { font-family: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace; }
    </style>
  </defs>

  <rect width="1200" height="48" fill="#161e2e" />
  <rect x="16" y="12" width="28" height="24" rx="4" fill="#ff9900" />
  <text x="21" y="29" fill="#161e2e" class="txt" font-weight="900" font-size="14">aws</text>
  <rect x="70" y="9" width="380" height="30" rx="4" fill="#232f3e" stroke="#4b5563" stroke-width="1" />
  <text x="95" y="29" fill="#9ca3af" class="txt" font-size="12">Amazon S3 &gt; Objects</text>
  <text x="920" y="29" fill="#d1d5db" class="txt" font-size="12">us-east-1</text>
  <circle cx="980" cy="24" r="4" fill="#10b981" />
  <text x="995" y="29" fill="#f3f4f6" class="txt" font-size="12" font-weight="600">Sahana @ 5489-1029-4412</text>

  <rect y="48" width="1200" height="42" fill="#ffffff" stroke="#e5e7eb" stroke-width="1" />
  <text x="24" y="74" fill="#2563eb" class="txt" font-size="13">Amazon S3</text>
  <text x="96" y="74" fill="#6b7280" class="txt" font-size="13">&gt;</text>
  <text x="112" y="74" fill="#2563eb" class="txt" font-size="13">Buckets</text>
  <text x="165" y="74" fill="#6b7280" class="txt" font-size="13">&gt;</text>
  <text x="180" y="74" fill="#111827" class="txt" font-size="13" font-weight="600">sahana-secure-image-gallery</text>

  <rect y="90" width="1200" height="610" fill="#f9fafb" />

  <g transform="translate(40, 110)">
    <!-- Header -->
    <rect width="1120" height="65" rx="6" fill="#ffffff" stroke="#e5e7eb" stroke-width="1" />
    <text x="24" y="38" fill="#111827" class="txt" font-size="18" font-weight="700">Objects (6)</text>
    <text x="140" y="38" fill="#4b5563" class="txt" font-size="12">| Storage location: <tspan class="mono">s3://sahana-secure-image-gallery/</tspan></text>

    <!-- Versioning Toggle Pill -->
    <rect x="910" y="18" width="190" height="30" rx="4" fill="#eff6ff" stroke="#bfdbfe" />
    <circle cx="925" cy="33" r="5" fill="#2563eb" />
    <text x="938" y="37" fill="#1d4ed8" class="txt" font-size="11" font-weight="600">Show versions: Enabled</text>

    <!-- Objects Table -->
    <rect y="85" width="1120" height="440" rx="6" fill="#ffffff" stroke="#e5e7eb" stroke-width="1" />
    <rect y="85" width="1120" height="38" fill="#f3f4f6" />
    <text x="24" y="108" fill="#374151" class="txt" font-size="12" font-weight="600">Name</text>
    <text x="360" y="108" fill="#374151" class="txt" font-size="12" font-weight="600">Type</text>
    <text x="490" y="108" fill="#374151" class="txt" font-size="12" font-weight="600">Last modified</text>
    <text x="680" y="108" fill="#374151" class="txt" font-size="12" font-weight="600">Size</text>
    <text x="790" y="108" fill="#374151" class="txt" font-size="12" font-weight="600">Storage class</text>
    <text x="940" y="108" fill="#374151" class="txt" font-size="12" font-weight="600">Encryption</text>

    <!-- Object 1 -->
    <text x="24" y="145" fill="#2563eb" class="mono" font-size="12" font-weight="600">hampi_stone_chariot.jpg</text>
    <text x="360" y="145" fill="#4b5563" class="txt" font-size="12">JPEG image</text>
    <text x="490" y="145" fill="#4b5563" class="txt" font-size="12">Nov 23, 2026, 18:30:15 UTC</text>
    <text x="680" y="145" fill="#4b5563" class="mono" font-size="12">765.8 KB</text>
    <text x="790" y="145" fill="#4b5563" class="txt" font-size="12">Standard</text>
    <text x="940" y="145" fill="#059669" class="mono" font-size="12">SSE-S3</text>
    <line x1="20" y1="160" x2="1100" y2="160" stroke="#f3f4f6" />

    <!-- Object 2 -->
    <text x="24" y="185" fill="#2563eb" class="mono" font-size="12" font-weight="600">coorg_coffee_plantation.jpg</text>
    <text x="360" y="185" fill="#4b5563" class="txt" font-size="12">JPEG image</text>
    <text x="490" y="185" fill="#4b5563" class="txt" font-size="12">Nov 23, 2026, 18:30:15 UTC</text>
    <text x="680" y="185" fill="#4b5563" class="mono" font-size="12">630.0 KB</text>
    <text x="790" y="185" fill="#4b5563" class="txt" font-size="12">Standard</text>
    <text x="940" y="185" fill="#059669" class="mono" font-size="12">SSE-S3</text>
    <line x1="20" y1="200" x2="1100" y2="200" stroke="#f3f4f6" />

    <!-- Object 3 -->
    <text x="24" y="225" fill="#2563eb" class="mono" font-size="12" font-weight="600">mysore_palace_illuminated.jpg</text>
    <text x="360" y="225" fill="#4b5563" class="txt" font-size="12">JPEG image</text>
    <text x="490" y="225" fill="#4b5563" class="txt" font-size="12">Nov 23, 2026, 18:30:15 UTC</text>
    <text x="680" y="225" fill="#4b5563" class="mono" font-size="12">871.4 KB</text>
    <text x="790" y="225" fill="#4b5563" class="txt" font-size="12">Standard</text>
    <text x="940" y="225" fill="#059669" class="mono" font-size="12">SSE-S3</text>
    <line x1="20" y1="240" x2="1100" y2="240" stroke="#f3f4f6" />

    <!-- Object 4 -->
    <text x="24" y="265" fill="#2563eb" class="mono" font-size="12" font-weight="600">bangalore_botanical_gardens.jpg</text>
    <text x="360" y="265" fill="#4b5563" class="txt" font-size="12">JPEG image</text>
    <text x="490" y="265" fill="#4b5563" class="txt" font-size="12">Nov 23, 2026, 18:30:15 UTC</text>
    <text x="680" y="265" fill="#4b5563" class="mono" font-size="12">500.3 KB</text>
    <text x="790" y="265" fill="#4b5563" class="txt" font-size="12">Standard</text>
    <text x="940" y="265" fill="#059669" class="mono" font-size="12">SSE-S3</text>
    <line x1="20" y1="280" x2="1100" y2="280" stroke="#f3f4f6" />

    <!-- Object 5 -->
    <text x="24" y="305" fill="#2563eb" class="mono" font-size="12" font-weight="600">gokarna_sunset_beach.jpg</text>
    <text x="360" y="305" fill="#4b5563" class="txt" font-size="12">JPEG image</text>
    <text x="490" y="305" fill="#4b5563" class="txt" font-size="12">Nov 23, 2026, 18:30:15 UTC</text>
    <text x="680" y="305" fill="#4b5563" class="mono" font-size="12">704.9 KB</text>
    <text x="790" y="305" fill="#4b5563" class="txt" font-size="12">Standard</text>
    <text x="940" y="305" fill="#059669" class="mono" font-size="12">SSE-S3</text>
    <line x1="20" y1="320" x2="1100" y2="320" stroke="#f3f4f6" />

    <!-- Object 6 -->
    <text x="24" y="345" fill="#2563eb" class="mono" font-size="12" font-weight="600">kabini_wildlife_reserve.jpg</text>
    <text x="360" y="345" fill="#4b5563" class="txt" font-size="12">JPEG image</text>
    <text x="490" y="345" fill="#4b5563" class="txt" font-size="12">Nov 23, 2026, 18:30:15 UTC</text>
    <text x="680" y="345" fill="#4b5563" class="mono" font-size="12">596.5 KB</text>
    <text x="790" y="345" fill="#4b5563" class="txt" font-size="12">Standard</text>
    <text x="940" y="345" fill="#059669" class="mono" font-size="12">SSE-S3</text>

    <!-- Table Footer Note -->
    <rect y="400" width="1120" height="40" fill="#f8fafc" />
    <text x="24" y="425" fill="#059669" class="txt" font-size="12" font-weight="600">✓ All objects stored in private Amazon S3 bucket with SSE-S3 AES-256 and Version IDs.</text>
  </g>
</svg>
